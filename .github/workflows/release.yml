name: Release

# Pushing a tag like v1.2.0 builds the jar plus a self-contained bundle (with its own Java runtime)
# per operating system and attaches everything to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # jpackage needs a full JDK; the jar itself still targets Java 17
          cache: maven
      - name: Check the tag matches pom.xml
        shell: bash
        run: |
          v=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match pom version $v"; exit 1; }
      - run: ./mvnw -B verify
      - name: Build the self-contained bundle
        shell: bash
        run: |
          mkdir dist
          extra=""
          [ "${{ matrix.os }}" = "windows-latest" ] && extra="--win-console"
          jpackage --type app-image --name weather --input target --main-jar weather.jar \
            --main-class dev.wolfi.weather.Main --dest dist $extra
      - name: Smoke-test the bundle
        shell: bash
        # The jar is already tested by `verify`; this runs the jpackage launcher itself
        # on its own OS, so a bundle that builds but does not start never gets published.
        run: |
          case "${{ matrix.os }}" in
            windows-latest) launcher="dist/weather/weather.exe" ;;
            macos-latest)   launcher="dist/weather.app/Contents/MacOS/weather" ;;
            *)              launcher="dist/weather/bin/weather" ;;
          esac
          out=$("$launcher" --version)
          echo "$out"
          case "$out" in weather\ *) ;; *) echo "unexpected --version output"; exit 1 ;; esac
          # An unknown place must exit 3 (documented in the README); this also proves the
          # runtime started far enough to make a real network call.
          set +e; "$launcher" "Nowhereville-xyz-12345" > /dev/null 2>&1; code=$?; set -e
          [ "$code" = "3" ] || { echo "expected exit code 3 for an unknown place, got $code"; exit 1; }
      - name: Zip the bundle
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../weather-${{ github.ref_name }}-${{ matrix.name }}.zip" weather > /dev/null
          else
            # jpackage names the macOS bundle weather.app, not weather; -y keeps its symlinks intact
            zip -qry "../weather-${{ github.ref_name }}-${{ matrix.name }}.zip" ./*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: weather-*.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: jar
          path: target/weather.jar

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Name the jar and write checksums
        run: |
          mv artifacts/weather.jar "artifacts/weather-${GITHUB_REF_NAME}.jar"
          cd artifacts && sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
